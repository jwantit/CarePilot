spring.application.name=carepilot

# 활성 프로파일 설정 (application-local.properties 자동 로드)
spring.profiles.active=local

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/Carepilot
spring.datasource.username=Carepilotuser
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 승인 링크 설정
app.approval.base-url=http://localhost:8080
app.approval.path=/auth/approve

# 프론트엔드 URL 설정
app.frontend.url=http://localhost:3000

# JWT 설정
jwt.secret=carepilot-secret-key-for-jwt-token-generation-minimum-256-bits-required-for-hmac-sha256
jwt.access-token-validity=3600000
jwt.refresh-token-validity=86400000

# 카카오 OAuth2 설정
spring.security.oauth2.client.registration.kakao.client-id=9c3ff0b1db60e60ac1bdbfdef860e212
spring.security.oauth2.client.registration.kakao.client-secret=gexMBOTG8hll3steeMdV8Xxhe5P6HQXe
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:8080/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# 이메일 발송 설정 (Gmail SMTP)
# 실제 계정 정보는 application-local.properties 또는 환경 변수로 설정
app.email.enabled=${MAIL_ENABLED:true}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000